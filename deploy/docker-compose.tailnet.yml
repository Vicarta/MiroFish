services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile.prod
    image: mirofish-backend:prod
    container_name: mirofish-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      FLASK_DEBUG: "false"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      MIROFISH_RUNTIME_ENV_FILE: /app/backend/runtime-config/settings.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    ports:
      - "127.0.0.1:${MIROFISH_API_PORT:-15001}:5001"
    volumes:
      - ../data/uploads:/app/backend/uploads
      - ../data/logs:/app/backend/logs
      - ../data/config:/app/backend/runtime-config

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile.prod
    image: mirofish-frontend:prod
    container_name: mirofish-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    ports:
      - "127.0.0.1:${MIROFISH_UI_PORT:-13000}:80"
